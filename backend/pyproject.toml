[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-guardian"
version = "0.1.0"
description = "AI-powered risk and quality analysis for GitHub pull requests"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
aws = [
    "boto3>=1.34",
]

[project.scripts]
guardian = "guardian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
